name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# A second push to the same branch makes the first run's answer worthless, and six jobs across
# four architectures is not a cheap thing to leave running for an answer nobody will read. The
# default branches are exempt: their runs are the record of what was merged.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # This job compiles the Linux host, which encodes through VAAPI, and the shell, whose
      # Linux backend is WebKitGTK. Both are found through pkg-config, so a runner without the
      # headers does not skip them — it stops.
      #
      # This is also the only place they are checked. `pnpm lint:cross` cannot build either on a
      # Mac with no Linux sysroot, so the shell's Linux path has no local check at all.
      - name: Install the libraries the Linux build needs
        run: |
          sudo apt-get update
          sudo apt-get install -y libva-dev clang pkg-config \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # Saved even when the job fails. The default throws the cache away on a red run, which
      # is exactly the run somebody is about to push a fix to — and that fix would then compile
      # everything from nothing a second time.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: cargo fmt --all --check

      # Clippy also runs on every platform in the matrix below. It runs here as well because
      # this job fails fastest, and because a warning that only appears on Linux is still a
      # warning a reviewer should see before three build jobs have finished.
      #
      # The shell's bundle lists the stream client as a resource, and Tauri checks that the file
      # is there while its build script runs — which is every time this crate is compiled, not
      # only when an installer is being made. The client is built by `scripts/sidecar.mjs` as
      # part of packaging, so at this point it does not exist, and linting would stop on a
      # missing file it is not linting. Told here that the bundle has no resources, which is
      # true of a build that produces no bundle. `pnpm package` below runs with the real
      # configuration and is what proves the client actually ships.
      - run: cargo clippy --workspace --all-targets
        env:
          TAURI_CONFIG: '{"bundle":{"resources":[]}}'

  build:
    name: ${{ matrix.name }}
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-latest
          - name: windows-x64
            os: windows-latest
          # A runner of the architecture rather than a cross build from the x64 one: half of
          # the Windows code is behind `cfg(target_os)` and none of it has ever been run on
          # arm64, so a build that could not also execute the tests would be a green tick over
          # an untested binary.
          - name: windows-arm64
            os: windows-11-arm
          - name: linux-x64
            os: ubuntu-latest
          # Same reasoning as Windows on arm64, one milestone early: the Linux backends are
          # still empty, so for now this proves the crate builds for the architecture a thin
          # client would most likely be — a small board on somebody's desk rather than a tower.
          - name: linux-arm64
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      # The Linux host encodes through VAAPI, which needs the library and its headers to
      # build. Installed here rather than assumed, because a runner without them would skip
      # compiling the whole backend and report a green build for code nobody had checked.
      - name: Install the libraries the Linux build needs
        if: startsWith(matrix.name, 'linux')
        run: |
          sudo apt-get update
          sudo apt-get install -y libva-dev clang pkg-config \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
          cache-on-failure: true

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Per platform, because half of this repository is behind `cfg(target_os = ...)` and code
      # that only exists on Windows is never linted by a Linux-only job. Every bug of that
      # shape this project has had was caught by running clippy where the code actually
      # compiles.
      - name: Lint on this platform
        run: cargo clippy --workspace --all-targets
        # See the lint job: the stream client the bundle carries is built during packaging, and
        # this runs before it.
        env:
          TAURI_CONFIG: '{"bundle":{"resources":[]}}'

      # The VAAPI encoder is behind a feature because building it needs the libva headers,
      # which not every machine that compiles this repository has. This job installed them, so
      # this is where the backend actually gets compiled and linted.
      - name: Lint the VAAPI encoder
        if: startsWith(matrix.name, 'linux')
        run: cargo clippy --package prism-core --features vaapi --all-targets

      # Its tests are behind the same feature, so without this they compile nowhere and run
      # nowhere. They need no GPU: what they check is the reasoning around one — which
      # profile, which entrypoint, how the quantiser moves — and that is the part that would
      # otherwise only be checked by a machine nobody has to hand.
      - name: Test the VAAPI encoder
        if: startsWith(matrix.name, 'linux')
        run: cargo test --package prism-core --features vaapi

      - name: Rust tests
        run: cargo test --workspace
        # As above: the shell compiles here too, and the client it bundles is not built yet.
        env:
          TAURI_CONFIG: '{"bundle":{"resources":[]}}'

      - name: TypeScript tests
        run: pnpm test:ts

      - name: TypeScript types
        run: pnpm typecheck

      # The shell is a Rust binary with the interface baked into it, so building the application
      # is building the crate. There is no addon to produce first and no Node in the result: the
      # window is a webview the system already has, and everything behind it is this repository's
      # own code.
      #
      # Unsigned, so macOS and Windows will both say so on first launch. Signing is its own piece
      # of work and a build nobody can download is worth less than a warning.
      - name: Package the application
        run: pnpm package

      - uses: actions/upload-artifact@v7
        with:
          name: prism-${{ matrix.name }}
          path: target/release/bundle/**
          if-no-files-found: error

  rendezvous:
    name: rendezvous image
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The server is deployed as a container, so the thing that has to keep working is the
      # image rather than a `cargo build` of the same crate. It is also the one build that
      # proves the crate still links with no C toolchain at all: the image has no compiler in
      # it and the binary is statically linked against musl.
      - name: Build the container
        run: docker build -f deploy/rendezvous/Dockerfile -t prism-rendezvous .

      - name: It starts and binds its ports
        run: |
          docker run -d --rm --name rv -p 47300:47300/udp prism-rendezvous \
            --bind 0.0.0.0:47300
          sleep 3
          docker logs rv | tee /dev/stderr | grep -q 'listening on 0.0.0.0:47300'
          docker logs rv | grep -q 'relaying on port 47301'
          docker stop rv
