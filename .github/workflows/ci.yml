name: CI

on:
  push:
    branches: [main, develop]
    # A release is a tag on main. It runs the same jobs as a branch push and differs only in
    # what the build calls itself, which is what makes a release the same build as the one
    # before it with a different name rather than a separate path nobody exercises.
    tags: ['v*']
  pull_request:
    branches: [main, develop]

# A second push to the same branch makes the first run's answer worthless, so the first is
# stopped rather than left to finish into a queue behind it.
#
# Grouped by branch rather than by `github.ref`, which is not the branch on a pull request — it
# is `refs/pull/46/merge`, and a run of the merge commit is a different group from a run of the
# push that produced it. Two runs of the same work then wait for each other instead of one
# replacing the other, which is what happened.
#
# `main` and `develop` are exempt: their runs are the record of what was merged, and a record
# that can be cancelled by the next push is not one.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: >-
    ${{ github.ref_name != 'main' && github.ref_name != 'develop' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # This job compiles the Linux host, which encodes through VAAPI, and the shell, whose
      # Linux backend is WebKitGTK. Both are found through pkg-config, so a runner without the
      # headers does not skip them — it stops.
      #
      # This is also the only place they are checked. `pnpm lint:cross` cannot build either on a
      # Mac with no Linux sysroot, so the shell's Linux path has no local check at all.
      - name: Install the libraries the Linux build needs
        run: |
          sudo apt-get update
          sudo apt-get install -y libva-dev clang pkg-config \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # Saved even when the job fails. The default throws the cache away on a red run, which
      # is exactly the run somebody is about to push a fix to — and that fix would then compile
      # everything from nothing a second time.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: cargo fmt --all --check

      # Clippy also runs on every platform in the matrix below. It runs here as well because
      # this job fails fastest, and because a warning that only appears on Linux is still a
      # warning a reviewer should see before three build jobs have finished.
      #
      # The shell's bundle lists the stream process as an external binary, and Tauri checks that
      # the file is there while its build script runs — which is every time this crate is
      # compiled, not only when an installer is being made. It is built by `scripts/sidecar.mjs`
      # as part of packaging, so at this point it does not exist, and linting would stop on a
      # missing file it is not linting. Told here that the bundle has none, which is true of a
      # build that produces no bundle. `pnpm package` below runs with the real configuration and
      # is what proves the stream process actually ships.
      - run: cargo clippy --workspace --all-targets
        env:
          TAURI_CONFIG: '{"bundle":{"externalBin":[]}}'

      # The VAAPI encoder is behind a feature because building it needs the libva headers,
      # which not every machine that compiles this repository has. This job installed them, so
      # this is where the backend gets compiled and linted — once, rather than on each of the
      # two Linux runners in the matrix.
      - name: Lint the VAAPI encoder
        run: cargo clippy --package prism-core --features vaapi --all-targets

  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-latest
          - name: windows-x64
            os: windows-latest
          # A runner of the architecture rather than a cross build from the x64 one: half of
          # the Windows code is behind `cfg(target_os)` and none of it has ever been run on
          # arm64, so a build that could not also execute the tests would be a green tick over
          # an untested binary.
          - name: windows-arm64
            os: windows-11-arm
          - name: linux-x64
            os: ubuntu-latest
          # Same reasoning as Windows on arm64, one milestone early: the Linux backends are
          # still empty, so for now this proves the crate builds for the architecture a thin
          # client would most likely be — a small board on somebody's desk rather than a tower.
          - name: linux-arm64
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      # The Linux host encodes through VAAPI, which needs the library and its headers to
      # build. Installed here rather than assumed, because a runner without them would skip
      # compiling the whole backend and report a green build for code nobody had checked.
      - name: Install the libraries the Linux build needs
        if: startsWith(matrix.name, 'linux')
        run: |
          sudo apt-get update
          sudo apt-get install -y libva-dev clang pkg-config \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
          cache-on-failure: true

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Its tests are behind the same feature, so without this they compile nowhere and run
      # nowhere. They need no GPU: what they check is the reasoning around one — which
      # profile, which entrypoint, how the quantiser moves — and that is the part that would
      # otherwise only be checked by a machine nobody has to hand.
      - name: Test the VAAPI encoder
        if: startsWith(matrix.name, 'linux')
        run: cargo test --package prism-core --features vaapi

      # Warnings are denied here too, so the code behind this platform's `cfg` is still held to
      # the same bar — compiling the tests is what checks it. Clippy itself runs once, in the
      # job above, rather than five more times over the same workspace in three profiles.
      - name: Rust tests
        run: cargo test --workspace
        # The shell compiles here, and the stream process its bundle carries is built during
        # packaging, which is after this. See the lint job.
        env:
          TAURI_CONFIG: '{"bundle":{"externalBin":[]}}'

      - name: TypeScript tests
        run: pnpm test:ts

      - name: TypeScript types
        run: pnpm typecheck

      # What this build calls itself. A push to a branch is a development build and numbers
      # itself as a prerelease of the version being worked toward; a tag is that version. See
      # `scripts/version.mjs` for why they cannot simply be the same number with a suffix.
      - name: Name this build
        id: name
        shell: bash
        run: |
          if [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then
            PRISM_CHANNEL=production PRISM_BUILD=${{ github.run_number }} \
              node scripts/version.mjs >> "$GITHUB_OUTPUT"
          else
            PRISM_CHANNEL=development PRISM_BUILD=${{ github.run_number }} \
              node scripts/version.mjs >> "$GITHUB_OUTPUT"
          fi

      # The shell is a Rust binary with the interface baked into it, so building the application
      # is building the crate. There is no addon to produce first and no Node in the result: the
      # window is a webview the system already has, and everything behind it is this repository's
      # own code.
      #
      # Two different signatures, answering two different questions. The updater's minisign key
      # says an update came from this repository, and the application checks it before a byte of
      # it runs. A developer certificate says the operating system has heard of the publisher,
      # and is what decides whether anybody gets to run it in the first place.
      #
      # The second is set up below and only on macOS. Windows still has none, so SmartScreen
      # still warns on first launch there.
      #
      # Written into the environment rather than passed here, because Tauri reads these with
      # `var_os` and cannot tell an empty value from a deliberate one: an unset secret renders as
      # the empty string, and `APPLE_CERTIFICATE=""` makes it try to import a certificate that is
      # not there and fail the build. So a fork, or this repository before the secrets exist,
      # simply signs ad-hoc as it did before.
      - name: Take out the developer certificate, if there is one
        if: runner.os == 'macOS'
        env:
          CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          API_KEY: ${{ secrets.APPLE_API_KEY }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -z "$CERTIFICATE" ]; then
            echo "no developer certificate; this build will be signed ad-hoc"
            exit 0
          fi

          {
            echo "APPLE_CERTIFICATE<<PRISM_EOF"
            echo "$CERTIFICATE"
            echo "PRISM_EOF"
            echo "APPLE_CERTIFICATE_PASSWORD<<PRISM_EOF"
            echo "$CERTIFICATE_PASSWORD"
            echo "PRISM_EOF"
            echo "APPLE_SIGNING_IDENTITY<<PRISM_EOF"
            echo "$IDENTITY"
            echo "PRISM_EOF"
          } >> "$GITHUB_ENV"

          # Notarisation is asked for by the presence of credentials and nothing else. The key
          # has to be a file on disk, because that is what `APPLE_API_KEY_PATH` names.
          if [ -n "$API_KEY_P8" ]; then
            mkdir -p ~/private_keys
            printf '%s' "$API_KEY_P8" > ~/private_keys/AuthKey_"$API_KEY".p8
            {
              echo "APPLE_API_KEY=$API_KEY"
              echo "APPLE_API_ISSUER=$API_ISSUER"
              echo "APPLE_API_KEY_PATH=$HOME/private_keys/AuthKey_$API_KEY.p8"
            } >> "$GITHUB_ENV"
          fi

      - name: Package the application
        run: pnpm package
        env:
          PRISM_CHANNEL: ${{ steps.name.outputs.channel }}
          PRISM_BUILD: ${{ steps.name.outputs.build }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # Tauri notarises and staples the `.app` and stops there. The `.dmg` is what a person
      # actually downloads, and an unstapled one is quarantined on a machine that has never
      # seen it before — which is every machine that matters.
      - name: Notarise the disk image
        if: runner.os == 'macOS' && env.APPLE_API_KEY_PATH != ''
        run: |
          dmg=$(find target/release/bundle/dmg -maxdepth 1 -name '*.dmg')
          xcrun notarytool submit "$dmg" \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          xcrun stapler staple "$dmg"

      # What proves it worked. Every part of this has failed silently at least once: an
      # executable inside the bundle signed by nobody, a ticket that was never stapled, a
      # certificate that turned out to be the wrong kind. None of them stops a build.
      - name: It is signed, stapled, and the stream process is signed too
        if: runner.os == 'macOS' && env.APPLE_SIGNING_IDENTITY != ''
        run: |
          app=target/release/bundle/macos/Prism.app

          codesign --verify --deep --strict --verbose=4 "$app" 2>&1 | tee /tmp/verify
          # `--deep` does not descend into Contents/Resources, so this line is the only thing
          # that says the stream process was signed as code rather than copied in as data.
          grep -q 'validated:.*Contents/MacOS/prism-stream' /tmp/verify

          codesign -dv --verbose=4 "$app" 2>&1 | grep -q 'flags=.*runtime'
          xcrun stapler validate "$app"
          spctl --assess --verbose=4 --type execute "$app" 2>&1 | grep -q 'source=Notarized Developer ID'

      - uses: actions/upload-artifact@v7
        with:
          name: prism-${{ matrix.name }}
          path: target/release/bundle/**
          if-no-files-found: error

  # One release per run, carrying every platform's bundle and the signature beside it. The
  # updater reads this list and nothing else, so a platform whose job failed is simply a
  # platform this release does not offer — not a release that half exists.
  #
  # Only from this repository's own pushes. A fork's pull request runs with no secrets and
  # would produce unsigned bundles nobody could install.
  release:
    name: release
    needs: build
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Name this build
        id: name
        run: |
          if [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then
            PRISM_CHANNEL=production PRISM_BUILD=${{ github.run_number }} \
              node scripts/version.mjs >> "$GITHUB_OUTPUT"
          else
            PRISM_CHANNEL=development PRISM_BUILD=${{ github.run_number }} \
              node scripts/version.mjs >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v7
        with:
          path: bundles

      # Renamed so that one look at a file says what it is:
      #
      #     prism-<os>-<architecture>-<version>-<build>.<extension>
      #
      # The build number is a field of its own rather than part of the version, which is why the
      # version here is the plain one — a development build calls itself `1.0.0-dev.851` inside,
      # and writing that beside `851` would say the same thing twice.
      #
      # The extension is taken whole, because the ones that matter have two parts: `.app.tar.gz`
      # is what the updater installs on macOS and `.dmg` is what a person double-clicks, and a
      # rule that kept only the last dot would turn the first into `.gz`.
      #
      # `-maxdepth 2` is what keeps the bundler's own workings out of a release. The artifacts
      # sit one directory down, at `<kind>/<file>`, but the deb bundler leaves a build tree
      # beside its output — and the `control.tar.gz` inside it matched `*.tar.gz`, was renamed
      # `prism-linux-x64-1.0.0-159.tar.gz`, and shipped as though it were something to install.
      #
      # The signatures Tauri v2 writes sit next to the bundle they belong to and are named for
      # it: `Prism_x64-setup.exe.sig`, `Prism_amd64.AppImage.sig`, `Prism.app.tar.gz.sig`. There
      # is no `.nsis.zip` and no `.AppImage.tar.gz` — v2 signs the installer and the AppImage
      # themselves. Collecting only `*.tar.gz.sig` and `*.zip.sig`, as this did, left Windows and
      # Linux with a bundle and no signature, which the update endpoint can only answer with
      # silence.
      - name: Collect what each platform built
        env:
          BASE: ${{ steps.name.outputs.base }}
          BUILD: ${{ steps.name.outputs.build }}
        run: |
          mkdir -p release
          for dir in bundles/prism-*; do
            platform="${dir#bundles/prism-}"

            find "$dir" -maxdepth 2 -type f \( -name '*.tar.gz' -o -name '*.dmg' \
              -o -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \
              -o -name '*.sig' \) | while read -r file; do
              name="$(basename "$file")"

              case "$name" in
                *.app.tar.gz.sig) ext='.app.tar.gz.sig' ;;
                *.app.tar.gz)     ext='.app.tar.gz' ;;
                *.tar.gz.sig)     ext='.tar.gz.sig' ;;
                *.tar.gz)         ext='.tar.gz' ;;
                *.sig)            ext=".${name%.sig}" ; ext=".${ext##*.}.sig" ;;
                *)                ext=".${name##*.}" ;;
              esac

              cp "$file" "release/prism-${platform}-${BASE}-${BUILD}${ext}"
            done
          done
          ls -la release

      # A release nobody can update from is the failure this whole job exists to prevent, and it
      # looks exactly like a successful one: files uploaded, green tick, nothing installable.
      # So the pairs are checked here rather than discovered weeks later by an application that
      # quietly never updates.
      - name: Every bundle has its signature
        run: |
          missing=0
          for bundle in release/*.app.tar.gz release/*.exe release/*.AppImage; do
            [ -e "$bundle" ] || continue
            if [ ! -e "$bundle.sig" ]; then
              echo "no signature for $(basename "$bundle")"
              missing=1
            fi
          done
          exit "$missing"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', steps.name.outputs.version) }}
          name: ${{ steps.name.outputs.version }}
          # A development build is a prerelease in GitHub's sense as well as in semver's, which
          # is what keeps it out of the production line's answers.
          prerelease: ${{ steps.name.outputs.channel == 'development' }}
          files: release/*
          fail_on_unmatched_files: true

  rendezvous:
    name: rendezvous image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The server is deployed as a container, so the thing that has to keep working is the
      # image rather than a `cargo build` of the same crate. It is also the one build that
      # proves the crate still links with no C toolchain at all: the image has no compiler in
      # it and the binary is statically linked against musl.
      - name: Build the container
        run: docker build -f deploy/rendezvous/Dockerfile -t prism-rendezvous .

      - name: It starts and binds its ports
        run: |
          docker run -d --rm --name rv -p 47300:47300/udp prism-rendezvous \
            --bind 0.0.0.0:47300
          sleep 3
          docker logs rv | tee /dev/stderr | grep -q 'listening on 0.0.0.0:47300'
          docker logs rv | grep -q 'relaying on port 47301'
          docker stop rv

  # Building the image once, where every region will pull it from.
  #
  # Separate from the job above because that one proves the image works and this one publishes
  # it. Both architectures, because the machines this runs on are not all the same one and an
  # image that only runs where it was built is not a deployable artifact.
  image:
    name: publish the image
    needs: rendezvous
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      # Pinned by digest, not by tag. A tag is a name somebody can move; a digest is the image
      # or it is nothing.
      image: ${{ steps.pinned.outputs.image }}
      # Which machines to put it on. A secret rather than a list in this file, so adding a
      # region is a machine, a port, an address record and a line in that secret — not a commit.
      regions: ${{ steps.where.outputs.regions }}
    steps:
      - uses: actions/checkout@v7

      - name: Which regions there are
        id: where
        env:
          HOSTS: ${{ secrets.DEPLOY_HOSTS }}
        run: |
          # Collapsed to one line, because a matrix is read from a single output value. Checked
          # here rather than discovered by five jobs failing to start.
          printf '%s' "$HOSTS" | jq -c . > /tmp/regions.json
          echo "regions=$(cat /tmp/regions.json)" >> "$GITHUB_OUTPUT"
          echo "deploying to $(jq length /tmp/regions.json) regions"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Name the image after the commit it was built from
        id: name
        run: |
          registry=ghcr.io/${{ github.repository_owner }}/prism-rendezvous
          echo "image=${registry,,}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v7
        id: push
        with:
          context: .
          file: deploy/rendezvous/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.name.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Pin what was built
        id: pinned
        run: echo "image=${{ steps.name.outputs.image }}@${{ steps.push.outputs.digest }}" >> "$GITHUB_OUTPUT"

  # Putting it where it runs, on every region at once.
  #
  # Here rather than in a workflow of its own, and that is not tidiness. GitHub fires
  # `workflow_run` and `workflow_dispatch` only for a file on the **default branch**, which is
  # `main` — so `deploy.yml`, which lives on `develop`, has never run and cannot be run by hand.
  # It is not even listed. This job is in the workflow that *is* registered from `main`.
  #
  # Every region is one shape: this repository's `compose.yaml`, an `.env` that is the only
  # thing differing between them, and an image pulled by digest. The `.env` is not deployed and
  # never should be — it holds the region's name and its report token, and a server's secrets
  # belong to the server rather than to the repository that builds it.
  deploy:
    name: deploy ${{ matrix.region.region }}
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # To pull what the job above pushed. Read, not write: nothing here publishes.
      packages: read
    strategy:
      # One unreachable machine must not stop the others being updated. A half-updated set is
      # the ordinary state of a rolling deploy; a set nobody updated because the first machine
      # was down is worse.
      fail-fast: false
      matrix:
        region: ${{ fromJson(needs.image.outputs.regions) }}
    steps:
      - uses: actions/checkout@v7

      - name: Reach the region
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Pinned rather than accepted on sight. A deploy that trusts whatever answers can be
          # pointed somewhere else by anything that answers first.
          printf '%s\n' "$HOSTS" > ~/.ssh/known_hosts

      - name: Send what describes the deployment
        run: |
          scp deploy/rendezvous/compose.yaml \
            "${{ matrix.region.user }}@${{ matrix.region.host }}:/tmp/compose.yaml"

      - name: Pull the image and bring it up
        run: |
          ssh "${{ matrix.region.user }}@${{ matrix.region.host }}" "
            set -e
            # Root on most of these, a sudoer on the rest. One command shape either way.
            if [ \"\$(id -u)\" -eq 0 ]; then SUDO=; else SUDO=sudo; fi
            \$SUDO install -d -m 700 /opt/prism
            \$SUDO mv /tmp/compose.yaml /opt/prism/compose.yaml
            echo '${{ secrets.GITHUB_TOKEN }}' | \$SUDO docker login ghcr.io -u '${{ github.actor }}' --password-stdin
            cd /opt/prism
            \$SUDO env PRISM_IMAGE='${{ needs.image.outputs.image }}' \
              docker compose --env-file .env up -d --no-build --pull always
            \$SUDO docker image prune -f
          "

      # Asking whether the container is running is not the same as asking whether it works. A
      # region that came up but bound nothing is a container in perfect health serving nobody,
      # which is exactly what a restart that lost its `.env` looks like.
      - name: It is running and holding its ports
        run: |
          ssh "${{ matrix.region.user }}@${{ matrix.region.host }}" "
            set -e
            if [ \"\$(id -u)\" -eq 0 ]; then SUDO=; else SUDO=sudo; fi
            sleep 8
            \$SUDO docker inspect -f '{{.State.Running}}' prism-rendezvous | grep -qx true
            ss -lnu | grep -q ':47300 '
            ss -lnu | grep -q ':47301 '
            \$SUDO docker logs --tail 5 prism-rendezvous
          "

      # And the question neither of those answers: does it serve *this* region to somebody who
      # is not on the machine? Asked from here, over the internet, in the protocol itself.
      #
      # Three tries because this is UDP and one lost datagram is not a broken region — measured
      # during the migration that produced this job, where the first probe to a healthy region
      # timed out and the second answered.
      - name: It answers for itself, from outside
        run: |
          python3 - <<'PY'
          import os, socket, sys

          host = "${{ matrix.region.host }}"
          want = """${{ matrix.region.region }}"""

          for attempt in range(3):
              nonce = os.urandom(8)
              sock = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
              sock.settimeout(5)
              try:
                  sock.sendto(bytes([0x0c]) + nonce, (host, 47300))
                  answer, _ = sock.recvfrom(256)
              except socket.timeout:
                  print(f"attempt {attempt + 1}: no answer")
                  continue
              finally:
                  sock.close()

              if answer[0] != 0x0d or answer[1:9] != nonce:
                  sys.exit(f"{host} answered something else")

              said = answer[9:].split(b"\x00")[0].decode("utf8", "replace")

              if said != want:
                  sys.exit(f"{host} says it is {said!r}, not {want!r}")

              print(f"{host} answers for {said}")
              sys.exit(0)

          sys.exit(f"{host} never answered")
          PY
