name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check

      # Clippy also runs on every platform in the matrix below. It runs here as well because
      # this job fails fastest, and because a warning that only appears on Linux is still a
      # warning a reviewer should see before three build jobs have finished.
      - run: cargo clippy --workspace --all-targets

  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-latest
          - name: windows-x64
            os: windows-latest
          - name: linux-x64
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Per platform, because half of this repository is behind `cfg(target_os = ...)` and code
      # that only exists on Windows is never linted by a Linux-only job. Every bug of that
      # shape this project has had was caught by running clippy where the code actually
      # compiles.
      - name: Lint on this platform
        run: cargo clippy --workspace --all-targets

      - name: Rust tests
        run: cargo test --workspace

      - name: TypeScript tests
        run: pnpm test:ts

      - name: Build native addon
        run: pnpm build:native

      - name: Addon loads in Node
        run: pnpm smoke:node

      - name: Addon loads in Electron
        run: pnpm smoke:electron
        if: runner.os != 'Linux'

      # Electron ships chrome-sandbox expecting setuid root, which a CI checkout cannot
      # provide. The smoke test never renders, so dropping the sandbox is safe here.
      - name: Addon loads in Electron
        run: xvfb-run --auto-servernum pnpm exec electron scripts/electron-smoke.cjs --no-sandbox
        if: runner.os == 'Linux'

      # Both after the addon: its TypeScript declarations are generated by that build, so a
      # fresh checkout has nothing for the shells to compile against until it has run.
      - name: TypeScript types
        run: pnpm typecheck

      - name: Build the Electron shells
        run: pnpm --filter '!@prism/native' -r build

      - uses: actions/upload-artifact@v4
        with:
          name: prism-native-${{ matrix.name }}
          path: packages/native/*.node
          if-no-files-found: error

  rendezvous:
    name: rendezvous image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The server is deployed as a container, so the thing that has to keep working is the
      # image rather than a `cargo build` of the same crate. It is also the one build that
      # proves the crate still links with no C toolchain at all: the image has no compiler in
      # it and the binary is statically linked against musl.
      - name: Build the container
        run: docker build -f deploy/rendezvous/Dockerfile -t prism-rendezvous .

      - name: It starts and binds its ports
        run: |
          docker run -d --rm --name rv -p 47300:47300/udp prism-rendezvous \
            --bind 0.0.0.0:47300
          sleep 3
          docker logs rv | tee /dev/stderr | grep -q 'listening on 0.0.0.0:47300'
          docker logs rv | grep -q 'relaying on port 47301'
          docker stop rv
