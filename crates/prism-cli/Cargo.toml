[package]
name = "prism-cli"
description = "Headless Prism host and client, used for latency measurement and CI regression"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
prism-core.workspace = true
prism-stream = { workspace = true, optional = true }
clap = { version = "4", features = ["derive"] }

[features]
default = ["window"]

# The window, the relative mouse capture and the audio output.
#
# On by default, because a client without them is not a client. Turned off to build the parts
# that need no window — which is what `decode` is, and what a machine being used to check a
# decoder against a recording wants. The window itself lives in `prism-stream`, which is also
# what the shell runs; this flag decides whether this command can open one too.
window = ["dep:prism-stream", "prism-stream/window"]

[lints.rust]
missing_docs = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "warn"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi_Common",
] }
