[package]
name = "prism-cli"
description = "Headless Prism host and client, used for latency measurement and CI regression"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
prism-core.workspace = true
clap = { version = "4", features = ["derive"] }

[features]
default = ["window"]

# The window, the relative mouse capture and the audio output.
#
# On by default, because a client without them is not a client. Turned off to build the parts
# that need no window — which is what `decode` is, and what a machine being used to check a
# decoder against a recording wants. SDL is built from source and linked statically so that a
# machine *running* the client needs nothing installed, and that costs the machine *building*
# it a C toolchain and CMake. Somewhere with a decoder and neither of those is exactly where
# this flag earns itself: measured on Windows for ARM, where the compiler is an install away
# and CMake another.
window = ["dep:sdl3", "dep:sdl3-sys"]

# The window, the relative mouse capture and the audio output, on every platform that has a
# client.
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
sdl3 = { version = "0.18", features = ["build-from-source-static"], optional = true }
sdl3-sys = { version = "0.6", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-quartz-core = { version = "0.3", features = ["CALayer", "CAMetalLayer", "objc2-metal"] }
objc2-metal = { version = "0.3", features = ["MTLPixelFormat"] }

[lints.rust]
missing_docs = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "warn"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi_Common",
] }
