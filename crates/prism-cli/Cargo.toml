[package]
name = "prism-cli"
description = "Headless Prism host and client, used for latency measurement and CI regression"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
prism-core.workspace = true
clap = { version = "4", features = ["derive"] }

# The window, the relative mouse capture and the audio output, on every platform that has a
# client. Built from source and linked statically so a machine running the client needs no SDL
# installed; that costs a C toolchain and CMake on the machine doing the building.
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
sdl3 = { version = "0.18", features = ["build-from-source-static"] }
sdl3-sys = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-quartz-core = { version = "0.3", features = ["CALayer", "CAMetalLayer", "objc2-metal"] }
objc2-metal = { version = "0.3", features = ["MTLPixelFormat"] }

[lints.rust]
missing_docs = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "warn"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi_Common",
] }
