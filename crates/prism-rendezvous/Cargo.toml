[package]
name = "prism-rendezvous"
description = "Prism rendezvous server: registration, introduction, and address observation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# No async runtime. The whole server is one socket and two maps, and a blocking receive loop
# handles far more traffic than a registration every few minutes and a keepalive every fifteen
# seconds will ever produce. Reaching for tokio here would add a dependency and a scheduler to
# something that has neither concurrency nor blocking work to hide.
[dependencies]
prism-core.workspace = true
clap = { version = "4", features = ["derive"] }
getrandom = "0.3"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2 = "0.10"
thiserror.workspace = true
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "signal"] }
axum = "0.8.9"
rustls-acme = { version = "0.15.4", features = ["axum"] }
axum-server = "0.8.0"
futures = "0.3.34"

[lints.rust]
missing_docs = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "warn"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
tower = { version = "0.5.3", features = ["util"] }
