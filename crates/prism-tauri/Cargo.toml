[package]
name = "prism-tauri"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
prism-core.workspace = true
# For the messages only. The window itself is the other half of that crate and is not built
# here — this shell starts it as a process, it does not link it.
prism-stream.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = ["unstable", "tray-icon"] }
tauri-plugin-updater = "2.11.0"
# The smallest thing that does blocking HTTPS. The account is control plane — a request here is
# a function call on its own thread, and an async runtime would be a scheduler this shell has no
# use for. `rustls` rather than the system's TLS so there is nothing to find at build time, and
# no gzip because every body in this API is a few hundred bytes of JSON.
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSGeometry"] }
# The handle a machine being watched shows at the edge of its screen: a panel of its own, which
# is AppKit's and not the webview's, because a window the webview draws cannot be see-through
# without the private API the configuration would have to switch on for every window.
objc2-app-kit = { version = "0.3", features = [
    "NSPanel",
    "NSWindow",
    "NSResponder",
    "NSScreen",
    "NSGraphics",
    "NSColor",
    "NSView",
] }
