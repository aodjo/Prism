[package]
name = "prism-core"
description = "Prism data plane: capture, encode, transport, decode, present, input"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
prism-secret.workspace = true
thiserror.workspace = true
reed-solomon-erasure = "6.0"
chacha20poly1305 = "0.10"
# The features name exactly the primitives `Noise_IK_25519_ChaChaPoly_BLAKE2s` uses, rather
# than the `default-resolver-crypto` bundle, which would also build AES and SHA-2 that nothing
# here calls. `std` is deliberately off: snow's `std` feature lists `ring/std`, which in
# Cargo's old feature syntax also switches the optional `ring` dependency on, and ring is C
# that needs a cross linker `pnpm lint:cross` does not have. `risky-raw-split` hands over the
# session keys so `net::seal` can put the nonce on the wire, which is what makes the transport
# survive UDP reordering.
snow = { version = "0.10.0", default-features = false, features = ["default-resolver", "use-curve25519", "use-chacha20poly1305", "use-blake2", "use-getrandom", "risky-raw-split"] }
getrandom = "0.3"
hkdf = "0.12"
sha2 = "0.10"
rusty-opus = "0.9.1"
hmac = "0.12"
sha1 = "0.10"
subtle = "2"

[dev-dependencies]
serde_json.workspace = true

[lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "warn"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-core-foundation = { version = "0.3", features = ["CFBase", "CFDictionary", "CFString", "CFNumber", "CFArray"] }
objc2-core-media = { version = "0.3", features = ["CMBase", "CMTime", "CMSampleBuffer", "CMFormatDescription", "CMBlockBuffer", "CMAttachment", "objc2-core-audio-types"] }
objc2-core-video = { version = "0.3", features = ["CVBase", "CVReturn", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVPixelBufferPool", "CVMetalTexture", "CVMetalTextureCache", "objc2-metal"] }
objc2-foundation = { version = "0.3", features = ["NSString", "NSError"] }
objc2-quartz-core = { version = "0.3", features = ["CALayer", "CAMetalLayer", "objc2-metal"] }
objc2-metal = { version = "0.3", features = ["MTLDevice", "MTLCommandQueue", "MTLCommandBuffer", "MTLCommandEncoder", "MTLRenderPipeline", "MTLLibrary", "MTLTexture", "MTLResource", "MTLRenderPass", "MTLRenderCommandEncoder", "MTLPixelFormat", "MTLTypes", "MTLDrawable", "MTLBlitCommandEncoder"] }
objc2-video-toolbox = { version = "0.3", features = ["VTBase", "VTErrors", "VTSession", "VTCompressionSession", "VTCompressionProperties", "VTDecompressionSession", "VTDecompressionProperties", "objc2-core-media", "objc2-core-video", "objc2"] }
objc2-screen-capture-kit = { version = "0.3.2", features = ["SCStream", "SCShareableContent", "SCError"] }
objc2-core-audio-types = { version = "0.3.2", features = ["CoreAudioBaseTypes"] }
block2 = "0.6.2"
dispatch2 = "0.3.1"
objc2-core-text = "0.3.2"
objc2-core-graphics = "0.3.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    "Foundation",
    "Graphics_Capture",
    # What asking to capture without the yellow border answers with.
    "Security_Authorization_AppCapabilityAccess",
    "Graphics_DirectX_Direct3D11",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    # WASAPI, for capturing whatever the machine is playing.
    "Win32_Media_Audio",
    "Win32_Media_MediaFoundation",
    "Win32_Media_KernelStreaming",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    # `VARIANT`, which is how a Media Foundation encoder is given its settings.
    "Win32_System_Ole",
    "Win32_System_Power",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Media_Multimedia",
    "Win32_Security",
] }
windows-core = "0.62"

[features]
# The Linux host's VAAPI encoder. Off by default because building it needs the libva headers
# and libclang on the build machine, and `pnpm lint:cross` compiles the Linux target from a
# Mac that has neither. Turned on where the encoder is actually built: CI's Linux job, and a
# Linux machine with a GPU. See `docs/linux-build.md`.
vaapi = ["dep:libva"]
# Everything a Linux desktop needs to watch and be watched: the software H.264 encoder and
# decoder, the screen through PipeWire, and the portal that grants both the screen and the
# input. Off by default for the reason `vaapi` is — each of these builds C, or binds a system
# library through its headers, and a Mac running `pnpm lint:cross` has neither a Linux C
# toolchain nor the headers. The shell and the stream window turn it on where they are built for
# Linux. The code behind it is compiled under `cfg(linux_desktop)`; see `build.rs`.
linux-desktop = [
    "dep:openh264",
    "dep:openh264-sys2",
    "dep:ashpd",
    "dep:pipewire",
    "dep:pollster",
]

[target.'cfg(target_os = "linux")'.dependencies]
# The maintained fork of ChromiumOS's `cros-libva`. The original is pinned to an older libva
# and does not compile against the 1.23 headers Debian and Ubuntu now ship — a compile error
# rather than a subtle one, but a wall all the same.
libva = { version = "0.1.4", optional = true }
# Cisco's H.264 codec, built from its source into this binary. What every Linux machine can
# encode and decode with, whatever GPU it has or does not have — a board on a desk, a virtual
# machine, a laptop whose driver has no VAAPI encoder. The `-sys` crate is named as well for the
# two constants that change the bitrate of a running encoder, which the wrapper does not expose.
openh264 = { version = "0.9.8", optional = true }
openh264-sys2 = { version = "0.9.8", optional = true }
# The desktop portal, which is how a Wayland desktop hands over its screen and its input. Its own
# executor rather than tokio: a runtime is what the hot path is forbidden, and nothing here needs
# one — each portal call is waited for on the thread that made it.
ashpd = { version = "0.13.13", default-features = false, features = [
    "async-io",
    "remote_desktop",
    "screencast",
], optional = true }
# The screen's frames, once the portal has granted them. Binds libpipewire through its headers.
pipewire = { version = "0.10.1", optional = true }
# Runs one portal call to completion on the calling thread. The smallest thing that does.
pollster = { version = "0.4", optional = true }
