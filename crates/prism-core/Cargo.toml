[package]
name = "prism-core"
description = "Prism data plane: capture, encode, transport, decode, present, input"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
thiserror.workspace = true
reed-solomon-erasure = "6.0"
chacha20poly1305 = "0.10"
# The features name exactly the primitives `Noise_IK_25519_ChaChaPoly_BLAKE2s` uses, rather
# than the `default-resolver-crypto` bundle, which would also build AES and SHA-2 that nothing
# here calls. `std` is deliberately off: snow's `std` feature lists `ring/std`, which in
# Cargo's old feature syntax also switches the optional `ring` dependency on, and ring is C
# that needs a cross linker `pnpm lint:cross` does not have. `risky-raw-split` hands over the
# session keys so `net::seal` can put the nonce on the wire, which is what makes the transport
# survive UDP reordering.
snow = { version = "0.10.0", default-features = false, features = ["default-resolver", "use-curve25519", "use-chacha20poly1305", "use-blake2", "use-getrandom", "risky-raw-split"] }
spake2 = "0.4"
getrandom = "0.3"
hkdf = "0.12"
sha2 = "0.10"
rusty-opus = "0.9.1"
argon2 = "0.5"
hmac = "0.12"
sha1 = "0.10"
subtle = "2"

[dev-dependencies]
serde_json.workspace = true

[lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "warn"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-core-foundation = { version = "0.3", features = ["CFBase", "CFDictionary", "CFString", "CFNumber", "CFArray"] }
objc2-core-media = { version = "0.3", features = ["CMBase", "CMTime", "CMSampleBuffer", "CMFormatDescription", "CMBlockBuffer", "CMAttachment", "objc2-core-audio-types"] }
objc2-core-video = { version = "0.3", features = ["CVBase", "CVReturn", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVPixelBufferPool", "CVMetalTexture", "CVMetalTextureCache", "objc2-metal"] }
objc2-foundation = { version = "0.3", features = ["NSString", "NSError"] }
objc2-quartz-core = { version = "0.3", features = ["CALayer", "CAMetalLayer", "objc2-metal"] }
objc2-metal = { version = "0.3", features = ["MTLDevice", "MTLCommandQueue", "MTLCommandBuffer", "MTLCommandEncoder", "MTLRenderPipeline", "MTLLibrary", "MTLTexture", "MTLResource", "MTLRenderPass", "MTLRenderCommandEncoder", "MTLPixelFormat", "MTLTypes", "MTLDrawable", "MTLBlitCommandEncoder"] }
objc2-video-toolbox = { version = "0.3", features = ["VTBase", "VTErrors", "VTSession", "VTCompressionSession", "VTCompressionProperties", "VTDecompressionSession", "VTDecompressionProperties", "objc2-core-media", "objc2-core-video", "objc2"] }
objc2-screen-capture-kit = { version = "0.3.2", features = ["SCStream", "SCShareableContent", "SCError"] }
objc2-core-audio-types = { version = "0.3.2", features = ["CoreAudioBaseTypes"] }
block2 = "0.6.2"
dispatch2 = "0.3.1"
objc2-core-text = "0.3.2"
objc2-core-graphics = "0.3.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    "Foundation",
    "Graphics_Capture",
    "Graphics_DirectX_Direct3D11",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    # WASAPI, for capturing whatever the machine is playing.
    "Win32_Media_Audio",
    "Win32_Media_KernelStreaming",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Media_Multimedia",
    "Win32_Security",
] }
windows-core = "0.62"

[features]
# The Linux host's VAAPI encoder. Off by default because building it needs the libva headers
# and libclang on the build machine, and `pnpm lint:cross` compiles the Linux target from a
# Mac that has neither. Turned on where the encoder is actually built: CI's Linux job, and a
# Linux machine with a GPU. See `docs/linux-build.md`.
vaapi = ["dep:libva"]

[target.'cfg(target_os = "linux")'.dependencies]
# The maintained fork of ChromiumOS's `cros-libva`. The original is pinned to an older libva
# and does not compile against the 1.23 headers Debian and Ubuntu now ship — a compile error
# rather than a subtle one, but a wall all the same.
libva = { version = "0.1.4", optional = true }
