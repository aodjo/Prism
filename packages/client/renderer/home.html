<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:; font-src 'self'"
    />
    <title>Prism</title>
    <link rel="stylesheet" href="prism.css" />
    <style>
      /* Home: the window somebody keeps open.
         A column of machines on the left that never moves, and everything about the one they
         picked on the right. */

      body {
        display: flex;
      }

      /* ── Backdrop ─────────────────────────────────────────────────────────────────────
         Two blobs rather than the flow's four, and no vignette. This window has content
         edge to edge and light in the middle of it would be light behind a reading surface. */
      .glow-top {
        left: 33.33%;
        top: -46.67%;
        width: 69.44%;
        height: 80%;
      }

      .glow-top img {
        inset: -33.33% -24%;
      }

      .glow-bottom {
        left: -20.83%;
        top: 62.22%;
        width: 55.56%;
        height: 71.11%;
      }

      .glow-bottom img {
        inset: -39.06% -31.25%;
      }

      /* ── Sidebar ──────────────────────────────────────────────────────────────────────── */
      .sidebar {
        position: relative;
        z-index: 1;
        display: flex;
        flex: none;
        flex-direction: column;
        width: 268px;
        height: 100%;
        padding: 62px 22px 20px;
        border-right: 1px solid var(--hairline-1);
        background: var(--bg-sidebar);
        -webkit-app-region: drag;
      }

      .sidebar button,
      .sidebar input {
        -webkit-app-region: no-drag;
      }

      .brand {
        flex: none;
      }

      .brand img {
        width: 15px;
        height: 13px;
      }

      .brand span {
        font-size: 13px;
        letter-spacing: 3px;
      }

      .search {
        display: flex;
        align-items: center;
        gap: 9px;
        flex: none;
        margin-top: 29px;
        padding: 9px 10px 9px 12px;
        border: 1px solid var(--hairline-1);
        border-radius: var(--radius-md);
        background: var(--surface-2);
      }

      .search .lens {
        color: var(--dim);
        font-size: 14px;
      }

      .search input {
        flex: 1 1 0;
        min-width: 0;
        padding: 0;
        border: 0;
        background: none;
        color: var(--ink);
        font-family: inherit;
        font-size: 13px;
      }

      .search input::placeholder {
        color: var(--dim);
      }

      .search input:focus {
        outline: 0;
      }

      .search kbd {
        color: var(--dim-2);
        font-family: inherit;
        font-size: 10.5px;
      }

      .section-label {
        flex: none;
        margin-top: 30px;
        color: var(--dim-2);
        font-size: 9.5px;
        font-weight: 500;
        letter-spacing: 1.3px;
      }

      .machines {
        display: flex;
        flex: 0 1 auto;
        flex-direction: column;
        gap: 4px;
        min-height: 0;
        margin-top: 10px;
        overflow-y: auto;
        scrollbar-width: none;
      }

      .machines::-webkit-scrollbar {
        display: none;
      }

      /* A row is a target, so the whole of it answers. The one being watched is the one that
         is lit; the others are as quiet as the sidebar they sit in. */
      .machine {
        display: flex;
        align-items: center;
        gap: 10px;
        flex: none;
        width: 100%;
        padding: 9px 10px;
        border: 1px solid transparent;
        border-radius: var(--radius-md);
        background: none;
        text-align: left;
        -webkit-app-region: no-drag;
      }

      .machine:hover {
        background: var(--surface-1);
      }

      .machine[aria-current='true'] {
        border-color: var(--hairline-3);
        background: var(--surface-4);
      }

      .machine img {
        display: block;
        flex: none;
        width: 7px;
        height: 7px;
        overflow: visible;
      }

      .machine .text {
        display: flex;
        flex: 1 1 0;
        min-width: 0;
        flex-direction: column;
        gap: 2px;
      }

      .machine .name {
        overflow: hidden;
        color: var(--ink);
        font-size: 13.5px;
        font-weight: 500;
        line-height: 1.2;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .machine[data-state='off'] .name {
        color: var(--muted-2);
      }

      .machine .os {
        overflow: hidden;
        color: var(--dim);
        font-size: 11px;
        line-height: 1.2;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .machine .ping {
        flex: none;
        color: var(--dim);
        font-size: 10.5px;
      }

      .add {
        display: flex;
        align-items: center;
        gap: 8px;
        flex: none;
        width: 100%;
        margin-top: 10px;
        padding: 10px 12px;
        border: 1px dashed var(--hairline-4);
        border-radius: var(--radius-md);
        background: none;
        color: var(--muted-2);
        font-size: 13px;
        font-weight: 500;
        text-align: left;
        -webkit-app-region: no-drag;
      }

      .add:hover {
        border-color: rgba(124, 92, 255, 0.5);
        color: var(--ink-2);
      }

      .add .plus {
        font-size: 14px;
      }

      /* Pushed to the floor of the sidebar rather than following the list, so that adding a
         machine does not move the account somebody is used to finding in one place. */
      .account {
        display: flex;
        align-items: center;
        gap: 10px;
        flex: none;
        width: 100%;
        margin-top: auto;
        padding: 9px 10px;
        border: 0;
        border-radius: var(--radius-md);
        background: var(--surface-1);
        text-align: left;
        -webkit-app-region: no-drag;
      }

      .account:hover {
        background: var(--surface-3);
      }

      .account img {
        display: block;
        flex: none;
        width: 26px;
        height: 26px;
      }

      .account .text {
        display: flex;
        flex: 1 1 0;
        min-width: 0;
        flex-direction: column;
        gap: 1px;
      }

      .account .who {
        overflow: hidden;
        color: var(--ink);
        font-size: 12.5px;
        font-weight: 500;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .account .kind {
        color: var(--dim);
        font-size: 10.5px;
      }

      .account .cog {
        flex: none;
        color: var(--dim);
        font-size: 13px;
      }

      /* ── Content ──────────────────────────────────────────────────────────────────────── */
      .content {
        position: relative;
        z-index: 1;
        display: flex;
        flex: 1 1 auto;
        flex-direction: column;
        min-width: 0;
        height: 100%;
        padding: 52px 40px 40px;
        -webkit-app-region: drag;
      }

      .content button,
      .content a {
        -webkit-app-region: no-drag;
      }

      .head {
        display: flex;
        align-items: center;
        gap: 14px;
        flex: none;
        min-height: 40px;
      }

      .head .title {
        display: flex;
        flex-direction: column;
        gap: 5px;
        min-width: 0;
      }

      .head h1 {
        margin: 0;
        overflow: hidden;
        font-size: 23px;
        font-weight: 600;
        letter-spacing: -0.3px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .head .where {
        color: var(--dim);
        font-size: 11px;
      }

      .head .spacer {
        flex: 1 1 0;
      }

      .live {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 8px 14px 8px 12px;
        border: 1px solid rgba(77, 232, 176, 0.22);
        border-radius: var(--pill);
        background: rgba(77, 232, 176, 0.12);
        color: var(--mint);
        font-size: 11.5px;
        font-weight: 500;
      }

      .live img {
        display: block;
        width: 6px;
        height: 6px;
        overflow: visible;
      }

      /* ── The stage ────────────────────────────────────────────────────────────────────
         What the remote machine looks like. The picture itself is not here and never will be:
         it is decoded and drawn by a process of its own, in a window of its own, because a
         frame that reached this one would have had to cross into JavaScript to get here. So
         this panel carries the numbers, the controls, and a likeness — and says which. */
      .stage {
        position: relative;
        flex: 1 1 auto;
        min-height: 0;
        margin-top: 26px;
        border: 1px solid var(--hairline-4);
        border-radius: var(--radius-2xl);
        background: linear-gradient(153deg, #151a2e 0%, #0f1424 35.7%, #1a1430 71.4%);
        box-shadow: 0 24px 60px -10px rgba(0, 0, 0, 0.55);
        overflow: hidden;
      }

      .stage .wallpaper {
        position: absolute;
        left: 9.07%;
        top: -21.92%;
        width: 82.42%;
        height: 126.81%;
        mix-blend-mode: screen;
      }

      .stage .wallpaper img {
        position: absolute;
        inset: -17.14% -13.33%;
        display: block;
        max-width: none;
      }

      .stage .mock {
        position: absolute;
        display: block;
        max-width: none;
      }

      /* Sized from the width alone so the height follows the artwork's own proportions. A
         stage that is not the shape it was drawn at would otherwise stretch the windows in it,
         and a stretched window reads as a rendering fault rather than as a likeness. */
      .stage .mock.one {
        left: 47.53%;
        top: 16.49%;
        width: 43.04%;
        height: auto;
      }

      .stage .mock.two {
        left: 10.9%;
        top: 27%;
        width: 47.62%;
        height: auto;
      }

      .dock {
        position: absolute;
        left: 50%;
        bottom: 10%;
        display: flex;
        gap: 10px;
        padding: 10px 12px;
        border: 1px solid var(--hairline-4);
        border-radius: var(--radius-xl);
        background: var(--surface-4);
        transform: translateX(-50%);
      }

      .dock i {
        display: block;
        width: 30px;
        height: 30px;
        border-radius: 8px;
      }

      .hud {
        position: absolute;
        left: 21px;
        top: 21px;
        display: flex;
        gap: 14px;
        padding: 9px 14px;
        border: 1px solid var(--hairline-3);
        border-radius: var(--radius-md);
        background: rgba(6, 6, 10, 0.55);
        color: var(--ink-3);
        font-size: 11px;
        font-variant-numeric: tabular-nums;
      }

      /* Over the likeness while nothing is running, so that a still picture is never mistaken
         for a live one. Once a stream is up the dimming lifts and the sentence moves to the
         foot of the panel — the caption still has to be there, because what is under it is a
         likeness either way and the real picture is in another window. */
      .curtain {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: 24px;
        background: rgba(6, 6, 10, 0.45);
        backdrop-filter: blur(1px);
        text-align: center;
        transition: background 200ms ease;
      }

      /* Top right once a stream is up: the head-up display owns the top left, and the foot of
         the panel is where the dock is. */
      .curtain[data-live='true'] {
        align-items: flex-end;
        justify-content: flex-start;
        background: rgba(6, 6, 10, 0.12);
        backdrop-filter: none;
      }

      .curtain p {
        max-width: 380px;
        margin: 0;
        color: var(--muted);
        font-size: 13px;
        line-height: 21px;
      }

      .curtain[data-live='true'] #curtain-text {
        padding: 7px 14px;
        border: 1px solid var(--hairline-3);
        border-radius: var(--pill);
        background: rgba(6, 6, 10, 0.66);
        color: var(--ink-3);
        font-size: 11.5px;
      }

      .curtain .error {
        max-width: 620px;
        font-size: 11.5px;
        text-align: left;
      }

      /* ── Metrics ──────────────────────────────────────────────────────────────────────── */
      .metrics {
        display: flex;
        gap: 16px;
        flex: none;
        margin-top: 16px;
      }

      .metric {
        display: flex;
        flex: 1 1 0;
        min-width: 0;
        flex-direction: column;
        gap: 10px;
        padding: 18px 20px;
        border: 1px solid var(--hairline-2);
        border-radius: var(--radius-xl);
        background: var(--surface-1);
      }

      .metric .label {
        color: var(--dim);
        font-size: 9.5px;
        font-weight: 500;
        letter-spacing: 1.3px;
      }

      .metric .value {
        display: flex;
        align-items: baseline;
        gap: 5px;
      }

      .metric .value b {
        font-size: 30px;
        font-weight: 600;
        letter-spacing: -0.8px;
        font-variant-numeric: tabular-nums;
      }

      /* No figure yet. An em dash set at thirty pixels reads as a rule rather than as an
         absence, so the placeholder is smaller and the colour of something not there. */
      .metric .value b:empty::before {
        content: '—';
        font-size: 20px;
        font-weight: 500;
        color: var(--dim);
      }

      .metric .value span {
        font-size: 13px;
        font-weight: 500;
      }

      /* A minute of history, one bar a second, oldest on the left. The bars fade towards the
         past rather than being one flat colour, so which end is now needs no label. */
      .spark {
        display: flex;
        align-items: flex-end;
        gap: 3px;
        height: 28px;
      }

      .spark i {
        display: block;
        flex: none;
        width: 4px;
        min-height: 2px;
        border-radius: 2px;
      }
    </style>
  </head>

  <body>
    <div class="backdrop">
      <div class="blob glow-top"><img src="assets/aurora-home1.svg" alt="" /></div>
      <div class="blob glow-bottom"><img src="assets/aurora-home2.svg" alt="" /></div>
    </div>

    <aside class="sidebar">
      <div class="wordmark brand">
        <img src="assets/mark-home.svg" alt="" />
        <span>PRISM</span>
      </div>

      <div class="search">
        <span class="lens">⌕</span>
        <input type="text" id="search" placeholder="Search devices" spellcheck="false" />
        <kbd>⌘K</kbd>
      </div>

      <div class="section-label">DEVICES</div>
      <div class="machines" id="machines"></div>

      <button type="button" class="add" id="add">
        <span class="plus">+</span><span>Add device</span>
      </button>

      <button type="button" class="account" id="account">
        <img src="assets/avatar.svg" alt="" />
        <span class="text">
          <span class="who" id="who">Not signed in</span>
          <span class="kind" id="kind">This machine only</span>
        </span>
        <span class="cog">⚙</span>
      </button>
    </aside>

    <main class="content">
      <div class="head">
        <div class="title">
          <h1 id="picked">No device</h1>
          <span class="where" id="picked-where">Add one to get started</span>
        </div>
        <div class="spacer"></div>
        <span class="live" id="live" hidden>
          <img src="assets/dot-live.svg" alt="" /><span id="live-text">Live</span>
        </span>
        <button type="button" class="btn-secondary" id="displays" disabled title="One display for now">
          Displays
        </button>
        <button type="button" class="btn-danger" id="disconnect" hidden>Disconnect</button>
        <button type="button" class="btn-primary sm" id="watch">Connect</button>
      </div>

      <div class="stage">
        <div class="wallpaper"><img src="assets/wallpaper-glow.svg" alt="" /></div>
        <img class="mock one" src="assets/mock-window-1.svg" alt="" />
        <img class="mock two" src="assets/mock-window-2.svg" alt="" />
        <div class="dock">
          <i style="background: rgba(124, 92, 255, 0.55)"></i>
          <i style="background: rgba(53, 214, 255, 0.55)"></i>
          <i style="background: rgba(77, 232, 176, 0.55)"></i>
          <i style="background: rgba(255, 176, 92, 0.55)"></i>
          <i style="background: rgba(255, 92, 168, 0.55)"></i>
          <i style="background: rgba(138, 138, 153, 0.55)"></i>
        </div>
        <div class="hud" id="hud" hidden>
          <span id="hud-size">—</span>
          <span id="hud-fps">—</span>
          <span id="hud-rate">—</span>
          <span id="hud-codec">—</span>
        </div>
        <div class="curtain" id="curtain">
          <p id="curtain-text">Pick a machine, and its screen opens in a window of its own.</p>
          <p class="error" id="curtain-error" hidden></p>
        </div>
      </div>

      <div class="metrics">
        <div class="metric">
          <span class="label">ROUND TRIP</span>
          <span class="value"><b id="m-rtt">—</b><span style="color: var(--mint)">ms</span></span>
          <div class="spark" id="spark-rtt"></div>
        </div>
        <div class="metric">
          <span class="label">FRAME RATE</span>
          <span class="value"><b id="m-fps">—</b><span style="color: var(--cyan)">fps</span></span>
          <div class="spark" id="spark-fps"></div>
        </div>
        <div class="metric">
          <span class="label">BITRATE</span>
          <span class="value"><b id="m-rate">—</b><span style="color: var(--violet)">Mbps</span></span>
          <div class="spark" id="spark-rate"></div>
        </div>
      </div>
    </main>

    <script type="module" src="home.js"></script>
  </body>
</html>
