<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'"
    />
    <title>Prism</title>
    <style>
      /* The window follows the system appearance rather than choosing one. */
      :root {
        color-scheme: light dark;
        --ink: #17181c;
        --muted: #6b7078;
        --line: #d9dce1;
        --ground: #f7f8fa;
        --raised: #ffffff;
        --accent: #2f6df6;
        --good: #1e9e5a;
        --bad: #d2453c;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --ink: #eceef2;
          --muted: #9aa1ac;
          --line: #33363d;
          --ground: #1b1d22;
          --raised: #24262c;
          --accent: #5b8dff;
          --good: #3fbf7a;
          --bad: #f0655c;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        /* Room at the top for the traffic lights, which sit over the content on macOS. */
        padding: 34px 16px 16px;
        font:
          13px/1.45 -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          system-ui,
          sans-serif;
        color: var(--ink);
        background: var(--ground);
        user-select: none;
        -webkit-user-select: none;
      }

      /* The strip the traffic lights sit on is the only place the window can be dragged, since
         the title bar itself is hidden. */
      .drag {
        position: fixed;
        inset: 0 0 auto 0;
        height: 34px;
        -webkit-app-region: drag;
      }

      h1 {
        margin: 0 0 2px;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }

      .sub {
        color: var(--muted);
        font-size: 11px;
      }

      section {
        margin-top: 12px;
        padding: 11px 12px;
        background: var(--raised);
        border: 1px solid var(--line);
        border-radius: 9px;
      }

      h2 {
        margin: 0 0 8px;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        min-height: 26px;
      }

      .row + .row {
        margin-top: 6px;
      }

      .row .value {
        color: var(--muted);
        font-variant-numeric: tabular-nums;
        text-align: right;
      }

      .status {
        display: flex;
        align-items: center;
        gap: 7px;
        font-weight: 500;
      }

      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--muted);
        flex: none;
      }

      .dot.live {
        background: var(--good);
      }

      .dot.waiting {
        background: var(--accent);
      }

      .dot.bad {
        background: var(--bad);
      }

      button {
        font: inherit;
        font-weight: 500;
        color: var(--ink);
        background: var(--ground);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 5px 11px;
        cursor: pointer;
      }

      button:hover:not(:disabled) {
        border-color: var(--accent);
        color: var(--accent);
      }

      button:disabled {
        opacity: 0.45;
        cursor: default;
      }

      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }

      button.primary:hover:not(:disabled) {
        color: #fff;
        filter: brightness(1.08);
      }

      input[type='text'] {
        font: inherit;
        color: var(--ink);
        background: var(--ground);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 4px 7px;
        width: 170px;
        text-align: right;
      }

      input:focus {
        outline: 2px solid var(--accent);
        outline-offset: -1px;
      }

      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11px;
        color: var(--muted);
        user-select: text;
        -webkit-user-select: text;
      }

      .empty {
        color: var(--muted);
        font-size: 12px;
      }

      .error {
        color: var(--bad);
        font-size: 11px;
        margin-top: 6px;
        white-space: pre-wrap;
        user-select: text;
        -webkit-user-select: text;
      }

      .pair-fields {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-top: 8px;
      }

      .pair-fields .row input {
        width: 190px;
      }

      /* Narrow, because it sits between a key and a button on one line. */
      input.address {
        width: 150px;
        font-size: 11px;
      }

      [hidden] {
        display: none !important;
      }
    </style>
  </head>

  <body>
    <div class="drag"></div>

    <h1>Prism</h1>
    <div class="sub"><code id="me">…</code></div>

    <section>
      <h2>Stream</h2>
      <div class="row">
        <span class="status"><span class="dot" id="dot"></span><span id="phase">Not connected</span></span>
        <button id="disconnect" hidden>Disconnect</button>
      </div>
      <div class="error" id="stream-error" hidden></div>
    </section>

    <section>
      <h2>Hosts</h2>
      <div id="hosts"><div class="empty">No host paired yet</div></div>
    </section>

    <section>
      <h2>Pair with a host</h2>
      <div class="pair-fields">
        <div class="row">
          <span>Address</span>
          <input type="text" id="pair-address" placeholder="192.168.1.5:47100" spellcheck="false" />
        </div>
        <div class="row">
          <span>Code</span>
          <input type="text" id="pair-code" placeholder="123456" inputmode="numeric" maxlength="6" />
        </div>
        <div class="row">
          <span></span>
          <button id="pair-button" class="primary">Pair</button>
        </div>
      </div>
      <div class="error" id="pair-error" hidden></div>
    </section>

    <section>
      <h2>Settings</h2>
      <div class="row">
        <span>Rendezvous</span>
        <input type="text" id="rendezvous" placeholder="host:47300" spellcheck="false" />
      </div>
      <div class="row">
        <span>Send input</span>
        <input type="checkbox" id="control" />
      </div>
      <div class="row">
        <span>Smooth playback</span>
        <input type="checkbox" id="smooth" />
      </div>
    </section>

    <script type="module" src="panel.js"></script>
  </body>
</html>
