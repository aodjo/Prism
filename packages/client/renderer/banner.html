<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:; font-src 'self'; connect-src ipc: http://ipc.localhost"
    />
    <title>Prism</title>
    <link rel="stylesheet" href="prism.css" />
    <!-- The window is nothing but the bar: everything around its rounded corners is the desktop
         behind it, so the page paints no background of its own. -->
    <style>
      html,
      body {
        background: transparent !important;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script src="bridge.js"></script>
    <script type="module" src="banner.js"></script>
  </body>
</html>
