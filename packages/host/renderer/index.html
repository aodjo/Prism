<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'"
    />
    <title>Prism</title>
    <style>
      /* The same palette the client window uses, because these are two halves of one product
         and a person runs both. A tray panel that followed the system appearance instead would
         match the menu bar it hangs from and match nothing else in Prism. */
      :root {
        color-scheme: dark;

        --ground: #14131a;
        --band: #1a1922;
        --raised: #201f2a;
        --line: #2b2937;
        --line-soft: #232231;

        --ink: #eceaf4;
        --ink-dim: #b3aec6;
        --muted: #7d7891;

        --accent: #a78bfa;
        --accent-ink: #17121f;

        --live: #4ade80;
        --wait: #7aa2f7;
        --warn: #f5c451;
        --bad: #f87171;

        --sans:
          -apple-system, BlinkMacSystemFont, 'Segoe UI Variable Text', 'Segoe UI', system-ui,
          sans-serif;
        --mono: ui-monospace, 'SF Mono', 'Cascadia Mono', 'JetBrains Mono', Menlo, monospace;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: var(--sans);
        font-size: 13px;
        line-height: 1.45;
        color: var(--ink);
        background: var(--ground);
        user-select: none;
        -webkit-user-select: none;
        -webkit-font-smoothing: antialiased;
      }

      /* ── Who this machine is ────────────────────────────────────────────────────────── */
      .crown {
        display: flex;
        align-items: baseline;
        gap: 10px;
        padding: 14px 16px 12px;
      }

      h1 {
        margin: 0;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }

      /* ── The one loud thing ─────────────────────────────────────────────────────────────
         Unlike the client, this one is always here: whether a machine is hosting is the
         whole question a person opens this panel to answer. */
      .state {
        padding: 12px 16px 12px 13px;
        border-top: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
        border-left: 3px solid var(--edge);
        background: color-mix(in oklab, var(--edge) 9%, var(--band));
        --edge: var(--muted);
      }

      .state[data-phase='waiting'],
      .state[data-phase='opening'] {
        --edge: var(--wait);
        animation: waiting 1.6s ease-in-out infinite;
      }

      @keyframes waiting {
        50% {
          border-left-color: color-mix(in oklab, var(--wait) 35%, var(--band));
        }
      }

      .state[data-phase='streaming'] {
        --edge: var(--live);
      }

      .state[data-phase='failed'] {
        --edge: var(--bad);
      }

      .state-line {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      #phase {
        font-size: 14px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }

      /* The numbers a running session produces. Hidden until there is a session, because a
         panel full of zeroes says a machine is doing something badly rather than nothing. */
      .readings {
        margin-top: 8px;
      }

      /* Nothing at all rather than an empty gap, for the state where every reading is hidden.
         A margin under a heading with no content below it reads as a section that failed to
         load. */
      .readings:not(:has(.row:not([hidden]))) {
        display: none;
      }

      /* ── Bands ───────────────────────────────────────────────────────────────────────── */
      .band {
        padding: 13px 16px;
        border-bottom: 1px solid var(--line-soft);
      }

      .band:last-of-type {
        border-bottom: 0;
      }

      h2 {
        margin: 0 0 8px;
        font-size: 12px;
        font-weight: 600;
        color: var(--ink-dim);
      }

      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        min-height: 26px;
      }

      .row .value {
        color: var(--ink-dim);
        font-variant-numeric: tabular-nums;
      }

      button {
        font: inherit;
        font-size: 12px;
        font-weight: 500;
        color: var(--ink-dim);
        background: var(--raised);
        border: 1px solid var(--line);
        border-radius: 7px;
        padding: 5px 12px;
        cursor: pointer;
        transition:
          background 120ms ease,
          color 120ms ease,
          border-color 120ms ease;
      }

      button:hover:not(:disabled) {
        color: var(--ink);
        border-color: color-mix(in oklab, var(--accent) 45%, var(--line));
      }

      button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      button:disabled {
        opacity: 0.4;
        cursor: default;
      }

      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--accent-ink);
        font-weight: 600;
      }

      button.primary:hover:not(:disabled) {
        background: color-mix(in oklab, var(--accent) 88%, white);
        border-color: color-mix(in oklab, var(--accent) 88%, white);
        color: var(--accent-ink);
      }

      input[type='text'],
      input[type='number'] {
        font: inherit;
        font-size: 12px;
        color: var(--ink);
        background: var(--ground);
        border: 1px solid var(--line);
        border-radius: 7px;
        padding: 5px 8px;
        width: 150px;
      }

      input::placeholder {
        color: var(--muted);
      }

      input:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: -1px;
      }

      input[type='checkbox'] {
        accent-color: var(--accent);
        width: 15px;
        height: 15px;
      }

      code {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--muted);
        user-select: text;
        -webkit-user-select: text;
      }

      /* The one number in this application a person reads out loud to somebody else, so it is
         set at the size that survives being read off a screen from a step away. */
      .code {
        margin: 10px 0 4px;
        font-family: var(--mono);
        font-size: 30px;
        font-weight: 600;
        letter-spacing: 0.16em;
        text-align: center;
        color: var(--accent);
        user-select: text;
        -webkit-user-select: text;
      }

      .hint {
        text-align: center;
        color: var(--muted);
        font-size: 11px;
      }

      .error {
        color: var(--bad);
        font-size: 11px;
        margin-top: 6px;
        white-space: pre-wrap;
      }

      /* A missing grant is a warning rather than a failure: the host still runs, it just
         cannot do the thing the grant covers. */
      .grant {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        min-height: 26px;
      }

      .grant + .grant {
        margin-top: 8px;
      }

      .grant .why {
        color: var(--muted);
        font-size: 11px;
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
          animation: none !important;
        }
      }

      [hidden] {
        display: none !important;
      }
    </style>
  </head>

  <body>
    <header class="crown">
      <h1>Prism</h1>
      <code id="me">…</code>
    </header>

    <div class="state" id="state" data-phase="idle">
      <div class="state-line">
        <span id="phase">Not hosting</span>
        <button id="toggle" class="primary">Start hosting</button>
      </div>
      <div class="readings">
        <div class="row" id="peer-row" hidden>
          <span>Client</span><span class="value"><code id="peer"></code></span>
        </div>
        <div class="row" id="local-row" hidden>
          <span>Listening on</span><span class="value"><code id="local"></code></span>
        </div>
        <div class="row" id="observed-row" hidden>
          <span>Reachable at</span><span class="value"><code id="observed"></code></span>
        </div>
        <div class="row" id="rate-row" hidden>
          <span>Sending</span><span class="value" id="rate"></span>
        </div>
        <div class="row" id="frames-row" hidden>
          <span>Frames</span><span class="value" id="frames"></span>
        </div>
      </div>
      <div class="error" id="session-error" hidden></div>
    </div>

    <section class="band" id="permissions-section" hidden>
      <h2>Permissions</h2>
      <div id="permissions"></div>
    </section>

    <section class="band">
      <h2>Paired devices</h2>
      <div class="row">
        <span id="peers">None yet</span>
        <button id="pair-button">Pair a device</button>
      </div>
      <div id="pairing" hidden>
        <div class="code" id="pairing-code"></div>
        <div class="hint" id="pairing-hint">Type this on the other machine</div>
      </div>
      <div class="error" id="pair-error" hidden></div>
    </section>

    <section class="band">
      <h2>Settings</h2>
      <div class="row">
        <span>Rendezvous</span>
        <input type="text" id="rendezvous" placeholder="host:47300" spellcheck="false" />
      </div>
      <div class="row">
        <span>Frame rate</span>
        <input type="number" id="fps" min="1" max="480" step="1" />
      </div>
      <div class="row">
        <span>Bitrate (Mbps)</span>
        <input type="number" id="bitrate" min="1" max="200" step="1" />
      </div>
      <div class="row">
        <span>Allow control</span>
        <input type="checkbox" id="inject" />
      </div>
      <div class="row">
        <span>Host on launch</span>
        <input type="checkbox" id="autostart" />
      </div>
    </section>

    <script type="module" src="panel.js"></script>
  </body>
</html>
