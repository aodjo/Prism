<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Prism 관리</title>
    <!--
      The application's own icon, as `crates/prism-tauri/icons/icon.svg` draws it: the rounded
      square it sits on, the triangle that is not equilateral, and the stroke running through
      the three colours a prism splits light into. A tab is where somebody picks this out of
      twenty others, so it is the mark rather than something shaped like it.
    -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1024 1024'%3E%3Crect width='1024' height='1024' rx='228' fill='%2308080b'/%3E%3Cg transform='translate(512 512) scale(56) translate(-5.813 -5.37)'%3E%3Cpath d='M10.3574 9.25H1.26855L5.53809 1.48535L10.3574 9.25Z' fill='none' stroke='url(%23m)' stroke-width='1.5' stroke-linejoin='round'/%3E%3C/g%3E%3Cdefs%3E%3ClinearGradient id='m' x1='0.4' y1='5.4' x2='11.3' y2='5.4' gradientUnits='userSpaceOnUse'%3E%3Cstop stop-color='%2335D6FF'/%3E%3Cstop offset='0.5' stop-color='%237C5CFF'/%3E%3Cstop offset='1' stop-color='%23FF5CA8'/%3E%3C/linearGradient%3E%3C/defs%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/admin/style.css" />
  </head>
  <body>
    <!--
      Empty on purpose. Everything below the shell depends on who signed in and what the server
      answered, so the page is drawn once from that answer rather than shipped as markup that
      would have to be hidden again for anybody who is not an operator.
    -->
    <main id="root"></main>
    <script type="module" src="/admin/app.js"></script>
  </body>
</html>
