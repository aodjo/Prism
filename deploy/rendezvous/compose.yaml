# One rendezvous region.
#
# Copy `.env.example` to `.env`, fill it in, and from the repository root:
#
#   docker compose -f deploy/rendezvous/compose.yaml up -d --build
#
# See docs/rendezvous.md for what to open on the firewall and how to check it is working.

# Named rather than taken from whichever directory this file is in, so that the same stack
# brought up from a different path is the same stack. `PRISM_NAME` is what lets a second one run
# beside it — a staging region on the same machine, which is safe precisely because a region
# holds nothing: no volume, no file, nothing two of them could disagree about.
name: "${PRISM_NAME:-prism-rendezvous}"

services:
  rendezvous:
    build:
      context: ../..
      dockerfile: deploy/rendezvous/Dockerfile
    # Overridden by the deploy workflow with the image it built and pushed, so a server pulls a
    # tested build rather than compiling one. Left as a local name by default: somebody running
    # this by hand on their own box wants the source in front of them, not a registry.
    image: "${PRISM_IMAGE:-prism-rendezvous}"
    container_name: "${PRISM_NAME:-prism-rendezvous}"
    restart: unless-stopped

    # Host networking, and this is not a preference.
    #
    # The server's whole job is to observe the address a datagram came from and tell the other
    # peer to send there. Docker's bridge networking rewrites that address whenever the
    # userland proxy handles the packet, and the failure is silent: the server reports an
    # address inside the container network, both peers punch at something that does not exist,
    # and it looks exactly like a NAT that will not traverse. Host networking is the only
    # arrangement where what the server observes is what the peer actually is.
    network_mode: host

    command:
      # The relay takes the next port up, so a second region on one machine needs a gap of at
      # least two between them.
      - "--bind"
      - "0.0.0.0:${PRISM_PORT:-47300}"
      - "--region"
      - "${PRISM_REGION}"
      # Handed to a machine when it signs in, so neither end has to be told by hand where to
      # register. The name rather than this server's own address, because a machine that only
      # knew this region would stop finding hosts the moment a nearer one was added.
      - "--advertise"
      - "${PRISM_RENDEZVOUS_NAME}"

    # No `--accounts`, deliberately. This server keeps none: accounts live in
    # `packages/accounts`, a Worker over D1 at its own name, because they are the one piece of
    # state here that cannot be reconstructed and a single disk is a poor place for it. What is
    # left is what a region is for — introducing two machines and relaying between them when
    # they cannot meet — and all of it is soft state that rebuilds itself in fifteen seconds.
    #
    # Which is also why there is no volume and no reverse proxy any more. Nothing here writes
    # anything down, and nothing here speaks HTTP.

    # Two hash maps and a socket. This is a ceiling to make a runaway visible, not a figure it
    # will approach.
    deploy:
      resources:
        limits:
          memory: 256M

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    # The binary drops every capability it is given: it binds two unprivileged ports and does
    # nothing else a kernel would ask permission for. Nothing on the filesystem is writable
    # because nothing here writes.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
