# The reverse proxy in front of the rendezvous server's account API.
#
# The server itself speaks plain HTTP on the loopback and refuses to speak it anywhere else.
# TLS is this file's job, because a proxy already knows how to hold a certificate and renew
# one, and terminating TLS in the server would mean linking a cryptographic provider written
# in C — which would cost the property that it ships as one static binary with nothing in it.
#
# What crosses this proxy is the value that signs somebody in. It does not carry anything that
# opens a private key: that stays sealed under a secret derived from the same password and
# never sent anywhere. So a proxy that is compromised can impersonate an account and cannot
# read a screen.
#
# The UDP rendezvous does not come through here. Hole punching needs the real address and the
# real port, so 47300 and 47301 are forwarded to the server directly and are not proxied by
# anything.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name prism.kr;

    # certbot --nginx writes these two lines and renews what they point at.
    ssl_certificate     /etc/letsencrypt/live/prism.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/prism.kr/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Told to clients that have already arrived once, so a later attempt over plain HTTP does
    # not get the chance to be downgraded.
    add_header Strict-Transport-Security "max-age=63072000" always;

    location /v1/ {
        proxy_pass http://127.0.0.1:47380;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Sign-in derives a key from a password, deliberately slowly, and the server checks it
        # after that. A shorter timeout than the work takes turns a correct password into a
        # gateway error.
        proxy_read_timeout 30s;

        # Nothing here is large. A cap keeps a request that claims otherwise from reaching the
        # server at all.
        client_max_body_size 64k;
    }

    # Nothing else is served. A path that is not the API is not a path this machine has.
    location / {
        return 404;
    }
}

server {
    listen 80;
    listen [::]:80;

    server_name prism.kr;

    # Everything except the challenge certbot answers on, which has to stay reachable over
    # plain HTTP for renewal to work.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
